<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CineVibeBD - Lifetime Movie Radar & Admin Hub</title>
  <meta name="theme-color" content="#050507">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --card: #12131a;
      --border: rgba(255, 255, 255, 0.09);
      --primary: #e11d48;
      --orange: #f97316;
      --blue: #38bdf8;
      --green: #22c55e;
      --yellow: #facc15;
      --purple: #a855f7;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: #fff; padding: 12px 12px 75px; min-height: 100vh; }

    .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; position: sticky; top: 0; background: rgba(5,5,7,0.95); backdrop-filter: blur(10px); padding: 8px 0; z-index: 100; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand h1 { font-size: 17px; font-weight: 800; background: linear-gradient(90deg, #fff, #fda4af, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-actions { display: flex; gap: 6px; }
    .icon-pill-btn { background: var(--card); border: 1px solid var(--border); color: #fff; padding: 6px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
    .icon-pill-btn.primary { background: var(--primary); border-color: var(--primary); }

    .settings-panel { display: none; background: var(--card); border: 1px solid rgba(225,29,72,0.45); border-radius: 14px; padding: 13px; margin-bottom: 12px; }
    .settings-panel.open { display: block; }
    .settings-panel label { display: block; font-size: 11px; color: var(--yellow); font-weight: 700; margin-bottom: 3px; }
    .settings-panel input { width: 100%; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--border); background: #07080d; color: #fff; font-size: 12.5px; margin-bottom: 8px; outline: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .save-btn { width: 100%; padding: 9px; border: none; border-radius: 999px; background: linear-gradient(135deg, #22c55e, #16a34a); color: #050507; font-size: 12.5px; font-weight: 800; cursor: pointer; }

    .search-filter-bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .search-row { display: flex; gap: 6px; }
    .search-row input { flex: 1; padding: 9px 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: #fff; font-size: 13px; outline: none; }
    .search-row input:focus { border-color: var(--primary); }

    .filter-controls-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
    .filter-controls-row::-webkit-scrollbar { display: none; }
    .filter-btn { background: var(--card); border: 1px solid var(--border); color: #e4e4e7; padding: 6px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .filter-btn.active { background: rgba(56,189,248,0.18); border-color: var(--blue); color: var(--blue); }
    .select-pill { background: var(--card); border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; outline: none; }

    .selected-countries-strip { display: none; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .c-tag { background: rgba(225,29,72,0.2); border: 1px solid rgba(225,29,72,0.5); color: #fda4af; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; cursor: pointer; }

    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 7px 13px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; }
    .tab.active { background: linear-gradient(135deg, #e11d48, #f97316); border-color: transparent; color: #fff; box-shadow: 0 3px 10px rgba(225,29,72,0.35); }

    .bulk-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: rgba(18,19,26,0.9); border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .status-msg { font-size: 11.5px; color: var(--blue); font-weight: 700; flex: 1; min-width: 140px; }
    .bulk-btns { display: flex; gap: 5px; }
    .mini-btn { border: none; border-radius: 999px; padding: 5px 10px; font-size: 10.5px; font-weight: 800; cursor: pointer; color: #fff; }

    .card-list { display: flex; flex-direction: column; gap: 10px; }
    .movie-card { display: flex; gap: 11px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; position: relative; }
    .movie-card.on-site { border-color: rgba(34, 197, 94, 0.45); }
    .poster-col { position: relative; width: 82px; flex-shrink: 0; }
    .poster-col img { width: 82px; height: 120px; object-fit: cover; border-radius: 8px; background: #1c1d28; display: block; }
    .play-trailer-chip { position: absolute; bottom: 5px; left: 5px; right: 5px; background: rgba(0,0,0,0.82); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 9.5px; font-weight: 800; text-align: center; padding: 2px 0; border-radius: 5px; cursor: pointer; }

    .item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
    .badges-line { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .badge { font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 4px; }
    .b-red { background: #e11d48; color: #fff; }
    .b-blue { background: #0284c7; color: #fff; }
    .b-green { background: #16a34a; color: #fff; }
    .b-yellow { background: rgba(250,204,21,0.18); color: #facc15; border: 1px solid rgba(250,204,21,0.35); }
    .b-purple { background: rgba(168,85,247,0.2); color: #d8b4fe; }

    .item-title { font-size: 14px; font-weight: 800; color: #fff; line-height: 1.28; margin-bottom: 4px; }
    .item-meta { font-size: 11px; color: #cbd5e1; line-height: 1.45; margin-bottom: 7px; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .act-btn { border: none; border-radius: 999px; padding: 5px 9px; font-size: 10.5px; font-weight: 800; cursor: pointer; color: #fff; }
    .btn-dm { background: #16a34a; }
    .btn-ch { background: #2563eb; }
    .btn-admin { background: linear-gradient(135deg, #f97316, #e11d48); }
    .btn-cp { background: #27272a; border: 1px solid rgba(255,255,255,0.18); }
    .btn-save { background: rgba(250,204,21,0.15); border: 1px solid rgba(250,204,21,0.4); color: #facc15; }

    .load-more-btn { width: 100%; margin-top: 12px; padding: 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); color: #fff; font-size: 13px; font-weight: 800; cursor: pointer; }

    .news-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .news-card h3 { font-size: 13.5px; color: #fff; line-height: 1.45; margin-bottom: 8px; }

    /* দেশ ও ট্রেলার মডাল */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); z-index: 9000; justify-content: center; align-items: center; padding: 14px; }
    .modal-box { width: 100%; max-width: 420px; max-height: 85vh; background: #12131a; border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; }
    .modal-head h3 { font-size: 15px; font-weight: 800; color: #facc15; }
    .modal-close { background: rgba(255,255,255,0.12); border: none; color: #fff; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .country-search { width: 100%; padding: 9px 12px; border-radius: 999px; border: 1px solid var(--border); background: #07080d; color: #fff; font-size: 13px; outline: none; }
    .country-list-scroll { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 5px; max-height: 52vh; }
    .country-check-item { display: flex; align-items: center; justify-content: space-between; background: #0a0b10; border: 1px solid var(--border); padding: 9px 12px; border-radius: 10px; cursor: pointer; font-size: 13px; }
    .country-check-item.checked { border-color: #e11d48; background: rgba(225,29,72,0.14); }
    .country-check-item input { width: 18px; height: 18px; accent-color: #e11d48; cursor: pointer; }
    .modal-footer { display: flex; gap: 8px; }
    .modal-footer button { flex: 1; padding: 10px; border: none; border-radius: 999px; font-weight: 800; font-size: 12.5px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <h1>🎬 CineVibeBD Radar</h1>
    </div>
    <div class="header-actions">
      <button class="icon-pill-btn" onclick="toggleSettings()">⚙️ সেটিংস</button>

  <!-- সেটিংস (টোকেন, চ্যানেল, এডমিন প্যানেল লিংক) -->

      <select class="select-pill" id="genreFilterSelect" onchange="reloadCurrentTab()">

        <option value="9648">🔍 Mystery</option>

      <label class="filter-btn" style="cursor:pointer;">

  <div class="selected-countries-strip" id="selectedCountriesStrip"></div>

  <!-- ক্যাটাগরি ট্যাব -->

    <div class="tab" onclick="switchTab('top_rated', this)">⭐ টপ রেটেড</div>
    <div class="tab" onclick="switchTab('saved', this)">🔖 সেভড</div>
    <div class="tab" onclick="switchTab('news', this)">📰 বাংলা ও বিশ্ব নিউজ</div>

  <div class="bulk-bar">

    <div class="bulk-btns" id="bulkBtnsWrap">
      <button class="mini-btn" style="background:#16a34a;" onclick="bulkSend('admin')">📩 টপ ৩টি বটে</button>
      <button class="mini-btn" style="background:#2563eb;" onclick="bulkSend('channel')">📢 টপ ৩টি চ্যানেলে</button>
    </div>
  </div>

  <div class="card-list" id="contentList"></div>
  <button class="load-more-btn" id="loadMoreBtn" style="display:none;" onclick="loadMorePage()">➕ আরও মুভি দেখুন</button>

  <!-- পৃথিবীর সকল দেশের টিক চিহ্ন মডাল -->
  <div class="modal-bg" id="countryModal" onclick="if(event.target===this) closeCountryModal()">
    <div class="modal-box">
      <div class="modal-head">
        <h3>🌍 পৃথিবীর সকল দেশ (টিক চিহ্ন দিন)</h3>
        <button class="modal-close" onclick="closeCountryModal()">✕</button>
      </div>
      <input type="text" class="country-search" id="countrySearchInput" placeholder="দেশের নাম লিখুন (যেমন: Bangladesh, India)..." oninput="renderCountryCheckboxes()">
      <div class="country-list-scroll" id="countryListScroll"></div>
      <div class="modal-footer">
        <button style="background:#27272a; color:#fff;" onclick="clearCountries()">সব মুছুন (সকল দেশ)</button>
        <button style="background:#e11d48; color:#fff;" onclick="applyCountrySelection()">✅ দেখুন</button>
      </div>

  <!-- ট্রেইলার প্রিভিউ মডাল -->
  <div class="modal-bg" id="trailerModal" onclick="if(event.target===this) closeTrailerModal()">
    <div class="modal-box" style="max-width:460px;">
      <div class="modal-head">
        <h3 id="trailerModalTitle">🎬 Trailer</h3>
        <button class="modal-close" onclick="closeTrailerModal()">✕ বন্ধ</button>
      </div>
      <div id="trailerFrameWrap" style="width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden;"></div>
    </div>
  </div>

  <script>
    const TMDB_KEY = '8265bd1679663a7ea12ac168da84d2e8';
    const SITE_URL = 'https://cinevibebd.pages.dev/';

    const LANG_BN = {
      bn: 'বাংলা (Bengali)', hi: 'হিন্দি (Hindi)', en: 'ইংরেজি (English)', ta: 'তামিল (Tamil)',
      te: 'তেলুগু (Telugu)', ml: 'মালয়ালম (Malayalam)', kn: 'কন্নড় (Kannada)', ko: 'কোরিয়ান (Korean)',
      ja: 'জাপানি (Japanese)', zh: 'চাইনিজ (Chinese)', es: 'স্প্যানিশ (Spanish)', fr: 'ফরাসি (French)',
      tr: 'তুর্কি (Turkish)', ur: 'উর্দু (Urdu)', ar: 'আরবি (Arabic)', pa: 'পাঞ্জাবি (Punjabi)',
      mr: 'মারাঠি (Marathi)', ru: 'রুশ (Russian)', de: 'জার্মান (German)', it: 'ইতালীয় (Italian)'
    };

    const COUNTRY_BN = {
      BD: '🇧🇩 বাংলাদেশ (Bangladesh)', IN: '🇮🇳 ভারত (India)', US: '🇺🇸 আমেরিকা (USA)',
      GB: '🇬🇧 যুক্তরাজ্য (UK)', KR: '🇰🇷 দক্ষিণ কোরিয়া (South Korea)', JP: '🇯🇵 জাপান (Japan)',
      PK: '🇵🇰 পাকিস্তান (Pakistan)', TR: '🇹🇷 তুরস্ক (Turkey)', FR: '🇫🇷 ফ্রান্স (France)',
      CN: '🇨🇳 চীন (China)', ES: '🇪🇸 স্পেন (Spain)', DE: '🇩🇪 জার্মানি (Germany)',
      IT: '🇮🇹 ইতালি (Italy)', RU: '🇷🇺 রাশিয়া (Russia)', AE: '🇦🇪 আরব আমিরাত (UAE)',
      SA: '🇸🇦 সৌদি আরব (Saudi Arabia)', TH: '🇹🇭 থাইল্যান্ড (Thailand)', ID: '🇮🇩 ইন্দোনেশিয়া (Indonesia)',
      MY: '🇲🇾 মালয়েশিয়া (Malaysia)', CA: '🇨🇦 কানাডা (Canada)', AU: '🇦🇺 অস্ট্রেলিয়া (Australia)'
    };

    const PRIORITY_COUNTRIES = ['BD', 'IN', 'US', 'KR', 'GB', 'JP', 'PK', 'TR', 'FR', 'CN', 'ES', 'DE', 'IT', 'TH', 'ID', 'AE', 'SA'];
    const GENRE_MAP = { 28:'Action',12:'Adventure',16:'Animation',35:'Comedy',80:'Crime',99:'Documentary',18:'Drama',10751:'Family',14:'Fantasy',36:'History',27:'Horror',10402:'Music',9648:'Mystery',10749:'Romance',878:'Sci-Fi',53:'Thriller',10752:'War',37:'Western',10759:'Action & Adventure',10765:'Sci-Fi & Fantasy' };

    let allCountriesList = [];
    let selectedCountries = JSON.parse(localStorage.getItem('cv_radar_countries') || '[]');
    let savedMovies = JSON.parse(localStorage.getItem('cv_radar_saved') || '[]');
    let uploadedTitlesSet = new Set();
    let currentTab = 'releases';
    let currentItems = [];
    let currentNews = [];
    let currentPage = 1;
    let isSearchMode = false;
    const detailCache = {};

    const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    function setStatus(m) { document.getElementById('statusMsg').innerText = m; }

    function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
    function loadConfig() {
      document.getElementById('botTokenInput').value = localStorage.getItem('cv_alert_token') || '';
      document.getElementById('adminIdInput').value = localStorage.getItem('cv_alert_admin') || '7731713912';
      document.getElementById('channelIdInput').value = localStorage.getItem('cv_alert_channel') || '@supersp52';
      document.getElementById('adminPanelUrlInput').value = localStorage.getItem('cv_alert_admin_url') || './admin.html';
    }
    function saveConfig() {
      localStorage.setItem('cv_alert_token', document.getElementById('botTokenInput').value.trim());
      localStorage.setItem('cv_alert_admin', document.getElementById('adminIdInput').value.trim());
      localStorage.setItem('cv_alert_channel', document.getElementById('channelIdInput').value.trim());
      localStorage.setItem('cv_alert_admin_url', document.getElementById('adminPanelUrlInput').value.trim() || './admin.html');
      document.getElementById('settingsPanel').classList.remove('open');
      setStatus('✅ সেটিংস সেভ হয়েছে!');
    }

    async function loadUploadedMovies() {
      try {
        const res = await fetch(`./movies.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) return;
        const raw = await res.json();
        uploadedTitlesSet = new Set((raw || []).map(m => String(m.title || '').toLowerCase().replace(/[^a-z0-9]/g, '')).filter(s => s.length >= 2));
      } catch {}
    }

    function isAlreadyOnSite(title) {
      const clean = String(title || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      if (clean.length < 2) return false;
      for (const ex of uploadedTitlesSet) if (ex.includes(clean) || clean.includes(ex)) return true;
      return false;
    }

    /* পৃথিবীর সকল দেশের লিস্ট লোড */
    async function loadAllCountries() {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/configuration/countries?api_key=${TMDB_KEY}`);
        const list = await res.json();
        if (Array.isArray(list)) {
          list.sort((a, b) => {
            const ia = PRIORITY_COUNTRIES.indexOf(a.iso_3166_1);
            const ib = PRIORITY_COUNTRIES.indexOf(b.iso_3166_1);
            if (ia !== -1 && ib !== -1) return ia - ib;
            if (ia !== -1) return -1;
            if (ib !== -1) return 1;
            return a.english_name.localeCompare(b.english_name);
          });
          allCountriesList = list;
        }
      } catch {
        allCountriesList = PRIORITY_COUNTRIES.map(code => ({ iso_3166_1: code, english_name: COUNTRY_BN[code] || code }));
      }
      renderSelectedCountryStrip();
    }

    function openCountryModal() {
      document.getElementById('countrySearchInput').value = '';
      renderCountryCheckboxes();
      document.getElementById('countryModal').style.display = 'flex';
    }
    function closeCountryModal() { document.getElementById('countryModal').style.display = 'none'; }

    function renderCountryCheckboxes() {
      const q = document.getElementById('countrySearchInput').value.toLowerCase().trim();
      const box = document.getElementById('countryListScroll');
      const filtered = allCountriesList.filter(c => {
        const bn = COUNTRY_BN[c.iso_3166_1] || '';
        return c.english_name.toLowerCase().includes(q) || c.iso_3166_1.toLowerCase().includes(q) || bn.toLowerCase().includes(q);
      });
      box.innerHTML = filtered.map(c => {
        const code = c.iso_3166_1;
        const checked = selectedCountries.includes(code);
        const label = COUNTRY_BN[code] || `${c.english_name} (${code})`;
        return `
          <label class="country-check-item ${checked ? 'checked' : ''}">
            <span>${esc(label)}</span>
            <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleCountryCode('${code}', this)">
          </label>
        `;
      }).join('');
    }

    function toggleCountryCode(code, chk) {
      if (chk.checked) {
        if (!selectedCountries.includes(code)) selectedCountries.push(code);
      } else {
        selectedCountries = selectedCountries.filter(c => c !== code);
      }
      chk.closest('.country-check-item').classList.toggle('checked', chk.checked);
    }

    function clearCountries() {
      selectedCountries = [];
      localStorage.setItem('cv_radar_countries', '[]');
      renderCountryCheckboxes();
      renderSelectedCountryStrip();
      closeCountryModal();
      reloadCurrentTab();
    }

    function applyCountrySelection() {
      localStorage.setItem('cv_radar_countries', JSON.stringify(selectedCountries));
      renderSelectedCountryStrip();
      closeCountryModal();
      reloadCurrentTab();
    }

    function removeCountry(code) {
      selectedCountries = selectedCountries.filter(c => c !== code);
      localStorage.setItem('cv_radar_countries', JSON.stringify(selectedCountries));
      renderSelectedCountryStrip();
      reloadCurrentTab();
    }

    function renderSelectedCountryStrip() {
      const strip = document.getElementById('selectedCountriesStrip');
      const btn = document.getElementById('countryFilterBtn');
      if (selectedCountries.length === 0) {
        strip.style.display = 'none';
        btn.classList.remove('active');
        btn.innerText = '🌍 দেশ বাছাই (সকল দেশ) ▾';
      } else {
        strip.style.display = 'flex';
        btn.classList.add('active');
        btn.innerText = `🌍 ${selectedCountries.length}টি দেশ বাছাইকৃত ▾`;
        strip.innerHTML = selectedCountries.map(code => {
          const found = allCountriesList.find(c => c.iso_3166_1 === code);
          const name = COUNTRY_BN[code] || (found ? found.english_name : code);
          return `<span class="c-tag" onclick="removeCountry('${code}')">${esc(name)} ✕</span>`;
        }).join('');
      }
    }

    function getBdDateStrings() {
      const bdNow = new Date(Date.now() + 6 * 3600 * 1000);
      const fmt = (offsetDays) => new Date(bdNow.getTime() + offsetDays * 86400000).toISOString().split('T')[0];
      return { today: fmt(0), tomorrow: fmt(1), fmt };
    }

    function switchTab(tab, el) {
      currentTab = tab;
      isSearchMode = false;
      currentPage = 1;
      currentItems = [];
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');
      reloadCurrentTab();
    }

    async function reloadCurrentTab() {
      isSearchMode = false;
      currentPage = 1;
      currentItems = [];
      await fetchTabPage(1);

      currentPage++;
      await fetchTabPage(currentPage, true);

    async function fetchTabPage(page = 1, append = false) {
      const bulkWrap = document.getElementById('bulkBtnsWrap');
      const loadBtn = document.getElementById('loadMoreBtn');

      if (currentTab === 'saved') {
        bulkWrap.style.display = 'flex';
        loadBtn.style.display = 'none';
        currentItems = [...savedMovies];
        setStatus(`🔖 আপনার সেভ করা ${currentItems.length}টি মুভি`);
        renderCurrentTab();
        return;
      }

      if (currentTab === 'news') {
        bulkWrap.style.display = 'none';
        loadBtn.style.display = 'none';
        setStatus('বাংলা ও বিশ্ব মুভি নিউজ লোড হচ্ছে... ⏳');
        await loadNewsTab();
        return;
      }

      bulkWrap.style.display = 'flex';
      setStatus('মুভি খোঁজা হচ্ছে... ⏳');

      const { today, tomorrow, fmt } = getBdDateStrings();
      const rangeVal = document.getElementById('rangeFilterSelect').value;
      const genreId = document.getElementById('genreFilterSelect').value;
      const countryParam = selectedCountries.length > 0 ? `&with_origin_country=${selectedCountries.join('|')}` : '';
      const genreParam = genreId ? `&with_genres=${genreId}` : '';

      let url = '';
      if (currentTab === 'releases') {
        const pastStr = rangeVal === 'today' ? today : fmt(-Number(rangeVal));
        url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&primary_release_date.gte=${pastStr}&primary_release_date.lte=${today}&sort_by=popularity.desc${countryParam}${genreParam}&page=${page}`;
      } else if (currentTab === 'trending') {
        if (selectedCountries.length === 0 && !genreId) {
          url = `https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_KEY}&page=${page}`;
        } else {
          url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&primary_release_date.gte=${fmt(-90)}&primary_release_date.lte=${today}&sort_by=popularity.desc${countryParam}${genreParam}&page=${page}`;
        }
      } else if (currentTab === 'upcoming') {
        const futureDays = rangeVal === '30' ? 30 : 14;
        url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&primary_release_date.gte=${tomorrow}&primary_release_date.lte=${fmt(futureDays)}&sort_by=popularity.desc${countryParam}${genreParam}&page=${page}`;
      } else if (currentTab === 'series') {
        url = `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&sort_by=popularity.desc${countryParam}${genreParam}&page=${page}`;
      } else if (currentTab === 'top_rated') {
        url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&sort_by=vote_average.desc&vote_count.gte=${selectedCountries.length > 0 ? 10 : 300}${countryParam}${genreParam}&page=${page}`;
      }

      try {
        const data = await (await fetch(url)).json();
        const incoming = (data.results || []).filter(m => m.media_type !== 'person').map(m => ({
          ...m,
          _mediaType: m.media_type || (currentTab === 'series' ? 'tv' : 'movie')
        }));

        if (append) {
          const seen = new Set(currentItems.map(x => `${x._mediaType}_${x.id}`));
          incoming.forEach(x => { if (!seen.has(`${x._mediaType}_${x.id}`)) currentItems.push(x); });
        } else {
          currentItems = incoming;
        }

        loadBtn.style.display = (data.total_pages && page < data.total_pages && currentItems.length > 0) ? 'block' : 'none';
        setStatus(`✅ মোট ${currentItems.length}টি মুভি পাওয়া গেছে (${today})`);
        renderCurrentTab();
      } catch (e) {
        setStatus('⚠️ ডাটা লোড করতে সমস্যা হয়েছে!');
      }
    }

    async function doLiveSearch() {
      const q = document.getElementById('searchQueryInput').value.trim();
      if (!q) { reloadCurrentTab(); return; }
      isSearchMode = true;
      document.getElementById('bulkBtnsWrap').style.display = 'flex';

      } catch {
        setStatus('⚠️ সার্চ করা যায়নি!');
      }
    }

    async function loadNewsTab() {

      try {

          allNews.map((n, idx) => `
            <div class="news-card">

              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:11px;color:#94a3b8;">📅 ${(n.pubDate || '').split(' ')[0] || 'Today'}</span>
                <button class="act-btn btn-ch" onclick="sendSingleNews(${idx})">📢 চ্যানেলে পাঠান</button>

    async function getFullMovieDetails(m) {
      const type = m._mediaType || (m.first_air_date ? 'tv' : 'movie');
      const key = `${type}_${m.id}`;
      if (detailCache[key]) return detailCache[key];
      try {
        const res = await fetch(`https://api.themoviedb.org/3/${type}/${m.id}?api_key=${TMDB_KEY}&append_to_response=videos,credits`);
        const d = await res.json();

        const title = d.title || d.name || m.title || m.name || 'Untitled';
        const rating = d.vote_average ? Number(d.vote_average).toFixed(1) : 'New';
        const genres = (d.genres || []).map(g => g.name).join(', ') ||
          (m.genre_ids || []).map(id => GENRE_MAP[id]).filter(Boolean).join(', ') || 'Drama';
        const releaseDate = d.release_date || d.first_air_date || m.release_date || m.first_air_date || '2026';

        // দেশসমূহ
        let countries = (d.production_countries || []).map(c => COUNTRY_BN[c.iso_3166_1] || c.name);
        if (countries.length === 0 && Array.isArray(d.origin_country)) {
          countries = d.origin_country.map(code => COUNTRY_BN[code] || code);
        }
        const countryText = countries.join(', ') || 'International';

        // যে যে ভাষায় রিলিজ হয়েছে
        const langSet = new Set();
        if (d.original_language) langSet.add(LANG_BN[d.original_language] || d.original_language.toUpperCase());
        (d.spoken_languages || []).forEach(l => {
          if (l.iso_639_1) langSet.add(LANG_BN[l.iso_639_1] || l.english_name || l.name);
        });
        const languagesText = [...langSet].filter(Boolean).join(', ') || 'Original';

        const cast = (d.credits?.cast || []).slice(0, 8).map(c => c.name).join(', ');
        const yt = (d.videos?.results || []).find(v => v.site === 'YouTube' && v.type === 'Trailer') ||
                   (d.videos?.results || []).find(v => v.site === 'YouTube');
        const trailerUrl = yt ? `https://www.youtube.com/watch?v=${yt.key}` : '';
        const poster = (d.poster_path || m.poster_path) ? `https://image.tmdb.org/t/p/w500${d.poster_path || m.poster_path}` : '';

        const info = {
          id: d.id || m.id,
          mediaType: type,
          title, rating, genres, releaseDate,
          countries: countryText,
          languages: languagesText,
          overview: d.overview || '',
          cast, trailerUrl, poster,
          youtubeKey: yt ? yt.key : ''
        };
        detailCache[key] = info;
        return info;
      } catch {
        return {
          id: m.id,
          mediaType: type,
          title: m.title || m.name || 'Untitled',
          rating: m.vote_average ? Number(m.vote_average).toFixed(1) : 'New',
          genres: (m.genre_ids || []).map(id => GENRE_MAP[id]).filter(Boolean).join(', ') || 'Drama',
          releaseDate: m.release_date || m.first_air_date || '2026',
          countries: (m.origin_country || []).map(c => COUNTRY_BN[c] || c).join(', ') || 'International',
          languages: LANG_BN[m.original_language] || String(m.original_language || '').toUpperCase(),
          overview: m.overview || '',
          cast: '', trailerUrl: '',
          poster: m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : '',
          youtubeKey: ''
        };
      }
    }

    function buildTelegramCaption(info, mode) {
      let header = '🔥 <b>আজকে এটি আপলোড করতে পারেন (ট্রেন্ডিং)!</b>';
      if (mode === 'releases') header = '🚨 <b>নতুন রিলিজ আপডেট!</b>';
      else if (mode === 'upcoming') header = '📢 <b>আপকামিং মুভি আপডেট!</b>';
      else if (mode === 'series') header = '📺 <b>হিট ওয়েব সিরিজ আপডেট!</b>';
      else if (mode === 'top_rated') header = '⭐ <b>টপ রেটেড মুভি!</b>';

      return (
        `${header}\n\n` +
        `🎬 <b>নাম:</b> ${esc(info.title)}\n` +
        `⭐ <b>রেটিং:</b> ${esc(info.rating)}/10\n` +
        `🎭 <b>জেনার:</b> ${esc(info.genres)}\n` +
        `📅 <b>রিলিজ ডেট:</b> ${esc(info.releaseDate)}\n` +
        `🌍 <b>দেশ:</b> ${esc(info.countries)}\n` +
        `🗣️ <b>ভাষাসমূহ:</b> ${esc(info.languages)}\n\n` +
        `🌐 <b>আমাদের সাইট:</b> ${SITE_URL}`
      );
    }

    async function sendMovieTg(idx, targetType) {
      const token = document.getElementById('botTokenInput').value.trim();
      if (!token) {
        toggleSettings();
        alert('প্রথমে উপরের সেটিংসে আপনার Telegram Bot Token বসিয়ে সেভ করুন!');
        return false;
      }
      const chatId = targetType === 'channel'
        ? document.getElementById('channelIdInput').value.trim().replace(/^https?:\/\/(t\.me|telegram\.me)\//i, '@')
        : document.getElementById('adminIdInput').value.trim();

      const m = currentItems[idx];
      if (!m) return false;

      setStatus(`"${m.title || m.name}"-এর পূর্ণ তথ্য আনা হচ্ছে... ⏳`);
      const info = await getFullMovieDetails(m);
      const caption = buildTelegramCaption(info, isSearchMode ? 'trending' : currentTab).slice(0, 1000);

      setStatus(`টেলিগ্রামে পাঠানো হচ্ছে... ⏳`);
      try {
        const method = info.poster ? 'sendPhoto' : 'sendMessage';
        const body = info.poster
          ? { chat_id: chatId, photo: info.poster, caption, parse_mode: 'HTML' }
          : { chat_id: chatId, text: caption, parse_mode: 'HTML' };

        const res = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.ok) {
          setStatus(`✅ "${info.title}" সফলভাবে পাঠানো হয়েছে!`);
          return true;
        } else {
          setStatus(`⚠️ এরর: ${data.description || 'পাঠানো যায়নি'}`);
          return false;
        }
      } catch (e) {
        setStatus(`⚠️ নেটওয়ার্ক এরর: ${e.message}`);
        return false;
      }
    }

    async function bulkSend(targetType) {
      const visible = getVisibleItems().slice(0, 3);
      if (visible.length === 0) return;
      let okCount = 0;
      for (const m of visible) {
        const realIdx = currentItems.indexOf(m);
        const ok = await sendMovieTg(realIdx, targetType);
        if (ok) okCount++;
        await sleep(1200);
      }
      setStatus(`✅ মোট ${okCount}টি মুভি সফলভাবে পাঠানো হয়েছে!`);
    }

    async function copyMovieText(idx) {
      const m = currentItems[idx];
      if (!m) return;
      setStatus('পূর্ণ তথ্য কপি হচ্ছে... ⏳');
      const info = await getFullMovieDetails(m);
      const plain = buildTelegramCaption(info, currentTab).replace(/<\/?b>/g, '');

      setStatus(`✅ "${info.title}"-এর পূর্ণ তথ্য কপি হয়েছে!`);
    }

    async function sendSingleNews(idx) {
      const n = currentNews[idx];
      if (!n) return;
      const token = document.getElementById('botTokenInput').value.trim();
      if (!token) { toggleSettings(); alert('প্রথমে Bot Token সেভ করুন!'); return; }
      const chatId = document.getElementById('channelIdInput').value.trim().replace(/^https?:\/\/(t\.me|telegram\.me)\//i, '@');
      const msg = `📰 <b>সিনেমাপাড়ার খবর:</b>\n\n🔸 ${esc(n.title)}\n\n🎬 সব লেটেস্ট মুভি দেখতে ভিজিট করুন:\n🌐 ${SITE_URL}`;
      const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'HTML', disable_web_page_preview: true })
      });
      const data = await res.json();
      setStatus(data.ok ? '✅ নিউজ চ্যানেলে পাঠানো হয়েছে!' : `⚠️ এরর: ${data.description}`);
    }

    async function sendNewsToChannel() {
      const token = document.getElementById('botTokenInput').value.trim();
      if (!token) { toggleSettings(); alert('প্রথমে Bot Token সেভ করুন!'); return; }
      const chatId = document.getElementById('channelIdInput').value.trim().replace(/^https?:\/\/(t\.me|telegram\.me)\//i, '@');
      let msg = `📰 <b>আজকের বাংলা ও সিনেমাপাড়ার তাজা খবর</b>\n\n`;
      currentNews.slice(0, 5).forEach(n => { msg += `🔸 ${esc(n.title)}\n\n`; });
      msg += `🎬 সব লেটেস্ট মুভি দেখতে ভিজিট করুন:\n🌐 ${SITE_URL}`;
      const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'HTML', disable_web_page_preview: true })
      });
      const data = await res.json();
      setStatus(data.ok ? '✅ টপ ৫টি নিউজ চ্যানেলে পাঠানো হয়েছে!' : `⚠️ এরর: ${data.description}`);
    }

    function getVisibleItems() {
      const hideUploaded = document.getElementById('hideUploadedChk').checked;
      return currentItems.filter(m => !hideUploaded || !isAlreadyOnSite(m.title || m.name));
    }

    function renderCurrentTab() {
      if (currentTab === 'news' && !isSearchMode) return;
      const box = document.getElementById('contentList');
      const items = getVisibleItems();

      if (items.length === 0) {
        box.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:35px;">এই ফিল্টারে কোনো মুভি পাওয়া যায়নি। (উপরের সময়সীমা "৭ দিন" বা "৩০ দিন" দিয়ে দেখতে পারেন)</p>';
        return;
      }

      box.innerHTML = items.map(m => {
        const idx = currentItems.indexOf(m);
        const name = m.title || m.name || 'Untitled';
        const img = m.poster_path ? `https://image.tmdb.org/t/p/w200${m.poster_path}` : '';
        const rel = m.release_date || m.first_air_date || 'N/A';
        const rate = m.vote_average ? Number(m.vote_average).toFixed(1) : 'New';
        const lang = LANG_BN[m.original_language] || String(m.original_language || '').toUpperCase();
        const genres = (m.genre_ids || []).map(id => GENRE_MAP[id]).filter(Boolean).slice(0, 3).join(', ') || 'Movie';
        const onSite = isAlreadyOnSite(name);
        const isSaved = savedMovies.some(s => s.id === m.id && s._mediaType === m._mediaType);

        return `
          <div class="movie-card ${onSite ? 'on-site' : ''}">
            <div class="poster-col">
              <img src="${img}" alt="${esc(name)}" loading="lazy">
              <div class="play-trailer-chip" onclick="previewTrailer(${idx})">▶ ট্রেইলার</div>
            </div>
            <div class="item-body">
              <div>
                <div class="badges-line">
                  <span class="badge b-yellow">⭐ ${rate}</span>
                  <span class="badge b-blue">📅 ${rel}</span>
                  ${m._mediaType === 'tv' ? '<span class="badge b-purple">SERIES</span>' : ''}
                  ${onSite ? '<span class="badge b-green">✅ সাইটে আছে</span>' : '<span class="badge b-red">নতুন</span>'}
                </div>
                <div class="item-title">${esc(name)}</div>
                <div class="item-meta">🎭 ${esc(genres)}<br>🗣️ ${esc(lang)}</div>
              </div>
              <div class="btn-row">
                <button class="act-btn btn-admin" onclick="sendToAdminPanel(${idx})">⚡ এডমিন প্যানেলে পাঠান</button>
                <button class="act-btn btn-ch" onclick="sendMovieTg(${idx}, 'channel')">📢 চ্যানেলে</button>
                <button class="act-btn btn-dm" onclick="sendMovieTg(${idx}, 'admin')">📩 বটে</button>
                <button class="act-btn btn-cp" onclick="copyMovieText(${idx})">📋 কপি</button>
                <button class="act-btn btn-save" onclick="toggleSaveMovie(${idx})">${isSaved ? '★ সেভড' : '☆ সেভ'}</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    (async function init() {
      loadConfig();
      await Promise.all([loadUploadedMovies(), loadAllCountries()]);
      await reloadCurrentTab();
    })();
  </script>
</body>
  </html>
